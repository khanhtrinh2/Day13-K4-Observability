service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: p95 response latency must stay under 3000ms at least 99.5% of the 28d window; matches dashboard latency threshold and covers the rag_slow incident class.
  error_rate_pct:
    objective: 2
    target: 99.0
    note: Failed requests must stay under 2% of total requests at least 99.0% of the window; covers the tool_fail incident class.
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Daily spend must stay at or under $2.50; a hard budget, so target is 100% of days compliant. Covers the cost_spike incident class.
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: Mean quality_score across responses must stay at or above 0.75 for 95% of the window.
