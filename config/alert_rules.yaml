alerts:
  - name: HighLatencyP95
    severity: page
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#alert-1

  - name: HighErrorRate
    severity: page
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#alert-2

  - name: DailyCostBudgetBurn
    severity: ticket
    condition: daily_cost_usd > 2.5 for 10m
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#alert-3
